name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fail if any image file is committed
        run: |
          matches=$(git ls-files -- '*.png' '*.jpg' '*.jpeg' '*.gif' '*.webp' '*.svg' '*.bmp' '*.tiff' '*.ico')
          if [ -n "$matches" ]; then
            echo "Image files are not committed to this repo, which holds Markdown only. tgw publish bundles images into the site at build time." >&2
            echo "$matches" >&2
            exit 1
          fi

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tamnd/tolkiengateway-reader
          path: .reader
      - uses: actions/setup-go@v5
        with:
          go-version-file: .reader/go.mod

      - name: run the corpus audit
        working-directory: .reader
        env:
          TOLKIENGATEWAY_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/tgw audit --corpus "$GITHUB_WORKSPACE" --lang vi

      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality.md
